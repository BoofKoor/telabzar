name: tests

on:
  push:
    branches: [main]
  pull_request:

# یک اجرا برای هر شاخه؛ pushِ جدید اجرای قبلی را لغو می‌کند.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # بدونِ این، تایم‌اوتِ پیش‌فرضِ GitHub **۳۶۰ دقیقه** است، و همین یک‌بار
    # هزینه داد: در اجرای #۸۳ گامِ `apt-get install ffmpeg` گیر کرد و job شش
    # ساعت زنده ماند و بعد کلِ ران **cancelled** شد — یعنی یک هنگِ زیرساختی به
    # شکلِ «CI هیچ‌وقت تمام نشد» درآمد و PR بلوکه ماند، نه یک قرمزیِ سریع.
    # بدترین شکلِ ممکن، چون چیزی برای نگاه‌کردن نیست: نه لاگِ خطایی، نه چکِ
    # قرمزی؛ فقط یک چکِ ناتمام.
    #
    # ── چرا ۱۵، و این عدد روی چه چیزی سوار است ──
    # از اندازه‌گیری می‌آید نه حدس. اجرای **موفقِ #۸۲** (۲۰۲۶-۰۸-۱۷):
    #
    #   pytest → ۷۶ ثانیه   ·   panel → ۲۹ ثانیه
    #
    # پس ۱۵ دقیقه برای jobِ کندتر ~۱۲ برابر سرِ آزاد است و فقط وقتی شلیک
    # می‌کند که چیزی واقعاً هنگ کرده باشد، نه وقتی رانر یک روز کُند است.
    #
    # ⚠ **این حاشیه ثابت نیست، و اگر روزی این عدد قرمز شد کورکورانه بالایش
    # نبر.** سوییت در دو روز از ۷۲۶ به ۸۲۷ تست رسید؛ با همین شیب، روزی
    # می‌رسد که ۷۶ ثانیه دیگر ۷۶ ثانیه نباشد. پس اول **زمانِ واقعیِ گامِ
    # `pytest` را در آخرین ران بخوان** و تصمیم بگیر کدام حالت است:
    #   • سوییت واقعاً کندتر/بزرگ‌تر شده  → عدد را با همان نسبتِ ~۱۲ برابر
    #     دوباره حساب کن و همین کامنت را با اندازه‌گیریِ تازه به‌روز کن.
    #   • زمانِ سوییت تغییری نکرده        → چیزی هنگ کرده و تایم‌اوت دارد
    #     دقیقاً کارش را می‌کند؛ بالا بردنِ عدد فقط هنگ را دوباره پنهان
    #     می‌کند و ما را به همان شش ساعتِ #۸۳ برمی‌گرداند.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ۳.۱۲ چون ایمیج‌های اجرایی روی همین‌اند (`docker/*.Dockerfile`: python:3.12-slim).
      # عمداً بدونِ ماتریسِ چندنسخه‌ای — هدف، همان محیطِ تولید است نه پوششِ نسخه‌ها.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # محیط از صفر ساخته می‌شود: هیچ پکیجِ سیستمیِ از پیش‌نصب‌شده‌ای در کار نیست.
      # (روی یک ماشینِ دبیانی، `cryptography`ِ سیستمی که `_cffi_backend` نداشت سرِ
      # collect کلِ suite را می‌شکست — روی رانرِ تمیز اصلاً نصب نمی‌شود و PyJWT
      # با has_crypto=False درست کار می‌کند.)
      - name: install dev requirements
        run: pip install -r requirements-dev.txt

      # ffmpeg از فاز ۲ب لازم است: تست‌های `@pytest.mark.ffmpeg` مسیرِ رسانه را
      # با باینریِ واقعی می‌سنجند (معناشناسیِ `-ss/-to`، لغو، تایم‌اوت) و با ماک
      # فقط ادعای تست‌اند. ایمیجِ `ubuntu-latest` خودش ffmpeg **ندارد** — در
      # فهرستِ نرم‌افزارهای رسمیِ runner-images نیست — پس صریح نصب می‌شود.
      - name: install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      # به READMEی رانر تکیه نمی‌کنیم: خودِ اجرا باید حضورِ ffmpeg را ثابت کند،
      # وگرنه تست‌های نشان‌دار بی‌صدا skip می‌شوند و سبزیِ CI بی‌معنا می‌شود.
      - name: prove ffmpeg is present
        run: ffmpeg -version && ffprobe -version

      # همان استدلال برای `7z`، که تا امروز **پرسیده نشده بود**: `needs_7z` در
      # `tests/test_phase2a.py` تنها تستی را گیت می‌کند که رفتارِ path-traversalِ
      # خودِ 7-Zip را پین می‌کند — یعنی همان چیزی که گاردِ `archive_extract`
      # رویش حساب می‌کند. اگر رانر `7z` نداشته باشد آن تست **هیچ‌جا** اجرا
      # نمی‌شود و آن گارد را چیزی محافظت نمی‌کند.
      #
      # عمداً بدونِ نصبِ صریح، چون سؤال همین بود: آیا ایمیجِ `ubuntu-latest` خودش
      # `7z` دارد؟ **اجرای ۲۰۲۶-۰۸-۱۳ جواب داد: دارد.** پس آن تست از اول در CI
      # می‌دویده و مارکر مرده نبود — نگرانی بی‌مورد بود و همین گام ردش کرد.
      #
      # و **همان اجرا الگوی خودم را هم تصحیح کرد:** `7z --version` نحوِ درستی
      # نیست و خودِ 7-Zip با `Unknown switch: --version` و کدِ ۷ بیرون می‌آید —
      # یعنی باینری **هست** ولی سؤال را غلط پرسیده بودم. `7z i` (اطلاعاتِ
      # فرمت‌های پشتیبانی‌شده) نسخه را در سرش چاپ می‌کند و با صفر خارج می‌شود.
      # بی‌pipe نوشته شده تا کدِ خروج مالِ خودِ 7z بماند، نه مالِ `head`.
      - name: prove 7z is present
        run: 7z i

      # نگهبانِ «مارکر دوباره بی‌اثر نشود» عمداً **گامِ CI نیست**: با صفر تستِ
      # نشان‌دار، `pytest -m ffmpeg` همه را deselect می‌کند و با کدِ **صفر** خارج
      # می‌شود (کدِ ۵ فقط برای «هیچ تستی جمع نشد» است، نه deselect). پس آن گام
      # هیچ‌چیز را تضمین نمی‌کرد؛ نگهبان حالا خودش یک تست است
      # (`test_phase2b.test_the_ffmpeg_marker_is_not_dead_weight`) که محلی هم می‌دود.
      - name: pytest
        run: pytest -q

  # ── تست‌های رفتاریِ پنلِ ادمین ──────────────────────────────────────────────
  # عمداً jobِ **جدا** و **موازی** (بدونِ `needs:`): اگر به jobِ اصلی وابسته
  # می‌شد، یک قرمزیِ بی‌ربط در آن‌جا نتیجهٔ پنل را پنهان می‌کرد.
  #
  # دلیلِ وجودش: `app/admin_web.py` سرِ import به `cryptography` (خطِ ۲۸) و
  # `jinja2` (خطِ ۲۹) نیاز دارد که فقط در `requirements-admin.txt` هستند. jobِ
  # اصلی عمداً آن‌ها را نصب نمی‌کند (تا «محلی سبز، روی رانر قرمز» تکرار نشود)،
  # پس تنها راهِ پوششِ رفتاریِ ۳۱ مسیرِ پنل یک محیطِ دومِ صریح است.
  # اندازه‌گیری‌شده: دلتای دقیقِ این دو فایل ۵ توزیع است — دو تای اعلام‌شده
  # به‌علاوهٔ MarkupSafe/cffi/pycparser که وابستگیِ خودشان‌اند.
  panel:
    runs-on: ubuntu-latest
    # همان دلیل و همان اندازه‌گیریِ jobِ بالا (#۸۲: این job ۲۹ ثانیه)، پس
    # حاشیه‌اش این‌جا حتی بیشتر است. اگر قرمز شد، همان دو حالتِ بالا را چک کن.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-admin.txt

      - name: install dev + admin requirements
        run: pip install -r requirements-dev.txt -r requirements-admin.txt

      # کلِ شکلِ این job به یک رفتار بند است: `addopts = --ignore=tests/panel`
      # در `pytest.ini` نباید جلوی مسیرِ **صریحِ** `pytest tests/panel` را
      # بگیرد. امروز نمی‌گیرد (سنجیده شد، و
      # `test_the_ignore_does_not_beat_an_explicit_path` پینش می‌کند).
      #
      # **دقیقاً چه چیزی را می‌گیرد — با عدد، نه با فرض.** روی pytest 9.1.1 هر
      # سه مسیرِ «صفر تست» کدِ **۵** می‌دهند (نه صفر)، پس اگر آن تقدم برگردد،
      # job به‌هرحال قرمز می‌شود و این گام برای آن حالت **باربر نیست**. چیزی که
      # واقعاً می‌خرد دو چیز است: (۱) کفِ **فرسایش** — اگر پوشه از ۵ تست به ۱
      # برسد، کدِ خروج همچنان صفر است و فقط این گام می‌گیردش؛ (۲) بیمه در برابرِ
      # عوض‌شدنِ همین معناشناسی، که **اثباتاً عوض می‌شود**: §۶ ثبت کرده بود
      # «deselectِ همه کدِ صفر می‌دهد» و روی 9.1.1 اندازه‌گیری‌شده کدِ ۵ می‌دهد.
      #
      # کفِ عددی است نه تعدادِ دقیق: عددِ دقیق با هر تستِ تازه عوض می‌شود و
      # گارد را شکننده می‌کند.
      - name: prove the panel suite is actually collected
        run: |
          n=$(pytest tests/panel --collect-only -q | grep -c '::')
          echo "collected $n panel tests"
          test "$n" -ge 5

      - name: pytest (panel)
        run: pytest tests/panel -q
