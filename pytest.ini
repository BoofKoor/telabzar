[pytest]
testpaths = tests
# `tests/panel/` تنها جایی است که `app.admin_web` را import می‌کند و به همین
# دلیل `cryptography`/`jinja2` می‌خواهد — یعنی `requirements-admin.txt` که
# عمداً در `requirements-dev.txt` نیست. با این ignore، `pytest`ِ خالی (محلی و
# jobِ اصلیِ CI) بدونِ استکِ پنل سبز می‌ماند، در حالی که مسیرِ **صریح**
# (`pytest tests/panel`، همان کاری که jobِ `panel` می‌کند) اجرایش می‌کند.
#
# مارکر این کار را **نمی‌کند** و این با اجرا سنجیده شد: `-m "not panel"` باز هم
# ماژول را import می‌کند تا مارکرش را بخواند، پس در محیطِ بدونِ پنل کلِ ران با
# `Interrupted: 1 error during collection` می‌میرد — نه فقط آن یک تست.
addopts = --ignore=tests/panel
asyncio_mode = auto
markers =
    ffmpeg: needs a real ffmpeg/ffprobe on PATH (skipped when absent)
filterwarnings =
    ignore::DeprecationWarning
